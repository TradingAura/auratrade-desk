<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuraTrade Capital Desk</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('auratrade-desk-theme');
      if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --ground: #0a0a0b;
    --panel: #141416;
    --panel-2: #1b1c1f;
    --line: rgba(255, 255, 255, .09);
    --line-2: rgba(255, 255, 255, .18);
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --dim: #86868b;
    --accent: #2997ff;
    --win: #30d158; --loss: #ff453a; --gold: #a1a1a6; --cyan: #2997ff;
    --buy: #2997ff; --sell: #ff453a;
    --amber: #ff9f0a; --teal: #40c8b0;
    --r: 14px;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  [data-theme="light"] {
    color-scheme: light;
    --ground: #f5f5f7;
    --panel: #ffffff;
    --panel-2: #f5f5f7;
    --line: rgba(0, 0, 0, .09);
    --line-2: rgba(0, 0, 0, .2);
    --text: #1d1d1f;
    --muted: #515154;
    --dim: #6e6e73;
    --accent: #0071e3;
    --win: #0f7b3f; --loss: #d70015; --gold: #6e6e73; --cyan: #0071e3;
    --buy: #0071e3; --sell: #d70015;
    --amber: #b25000; --teal: #0f6b60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; overflow-y: hidden; scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    background: var(--ground); color: var(--text);
    font: 15px/1.55 "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -.006em;
    min-height: 100vh;
    overflow-y: hidden;
    transition: background .3s var(--ease), color .3s var(--ease);
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 18px 22px 20px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 2px 0 18px; margin-bottom: 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--ground); margin: -22px -22px 22px; padding: 22px 22px 0; border-bottom: 1px solid var(--line); }
  .topbar header { margin-bottom: 14px; }
  .topbar .range { margin: 0; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--text); color: var(--ground); display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: -.03em; }
  .brand h1 { font-size: 16.5px; font-weight: 700; letter-spacing: -.02em; }
  .brand small { display: block; color: var(--dim); font-size: 12px; font-weight: 500; letter-spacing: 0; margin-top: 1px; }
  .hdr-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .hdr-right svg { width: 15px; height: 15px; flex: none; }

  .conn, .bell, .notif-chip, .chip, .theme {
    display: inline-flex; align-items: center; gap: 7px; min-height: 40px;
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    white-space: nowrap; user-select: none; background: transparent;
    border: 1px solid var(--line); color: var(--muted);
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .bell, .notif-chip, .chip, .theme { cursor: pointer; }
  .bell:hover, .notif-chip:hover, .chip:hover, .theme:hover { color: var(--text); border-color: var(--line-2); }
  .bell:active, .notif-chip:active, .chip:active, .theme:active { transform: scale(.98); }
  .bell.on { color: var(--text); border-color: var(--line-2); }
  .notif-chip { color: var(--accent); border-color: var(--accent); }
  .chip.on { color: var(--ground); background: var(--text); border-color: var(--text); }
  [data-theme="light"] .chip.on { color: #fff; background: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.live { background: var(--win); }
  .dot.stale { background: var(--gold); }
  .dot.off { background: var(--loss); }

  .range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 26px; }
  .range .lbl { font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--dim); margin-right: 4px; text-transform: none; }
  .dates { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dim); }
  .dates input { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 9px 13px; font: inherit; font-size: 13px; min-height: 40px; }
  .range .note { font-size: 12.5px; color: var(--dim); flex-basis: 100%; line-height: 1.5; }

  .hero { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; gap: 28px; align-items: end; padding: 4px 0 26px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .hero-r { font-size: 56px; font-weight: 700; letter-spacing: -.035em; line-height: 1.02; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
  .hero-sub { font-size: 14px; color: var(--muted); }
  .hero-sub b { font-weight: 600; color: var(--text); }
  .hero-note { font-size: 12px; line-height: 1.5; color: var(--dim); margin-top: 8px; max-width: 52ch; }
  .hero-live { text-align: right; }
  .hero-n { font-size: 34px; font-weight: 700; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .curve-wrap { color: var(--win); }
  .curve-wrap.down { color: var(--loss); }
  .curve { display: block; width: 100%; height: 116px; }
  .curve .zero { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 4; }
  .curve-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; }
  .curve-empty { font-size: 13px; color: var(--dim); border: 1px dashed var(--line); border-radius: var(--r); padding: 30px 18px; text-align: center; }

  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0 0 14px; }
  .mainhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
  .mainhead h2 { margin: 0; }
  .tsearch { position: relative; margin-left: auto; }
  .tsearch input {
    height: 40px; width: 216px; box-sizing: border-box;
    padding: 0 30px 0 34px; font: inherit; font-size: 13px;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
    transition: border-color .18s var(--ease), width .18s var(--ease);
  }
  .tsearch input::placeholder { color: var(--muted); }
  .tsearch input::-webkit-search-cancel-button,
  .tsearch input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  .tsearch input:focus { border-color: var(--accent); width: 264px; }
  .tsearch .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
  .tsearch .clr { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 7px; cursor: pointer;
    background: none; color: var(--muted); font-size: 16px; line-height: 1; }
  .tsearch .clr:hover { color: var(--text); background: var(--panel-2); }
  .tcount { font-size: 12px; color: var(--dim); }
  @media (max-width: 560px) {
    .tsearch { margin-left: 0; width: 100%; }
    .tsearch input, .tsearch input:focus { width: 100%; }
  }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; }
  .side-sec { margin-bottom: 24px; }
  .side-sec:last-child { margin-bottom: 0; }
  .side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .side-head h2 { margin: 0; }
  .side-nav { display: flex; gap: 5px; }
  .nav-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: all .15s var(--ease);
  }
  .nav-btn:hover { color: var(--text); border-color: var(--line-2); background: var(--panel-2); }
  .side-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    overscroll-behavior-y: contain;
    padding: 2px 4px 10px 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
  }
  .side-scroll.live { height: 284px; max-height: 284px; }
  .side-scroll.pending { height: 235px; max-height: 235px; }
  .side-scroll::-webkit-scrollbar { width: 4px; }
  .side-scroll::-webkit-scrollbar-track { background: transparent; }
  .side-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .side-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .cdots { display: none; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; position: relative; overflow: hidden; cursor: pointer; transition: border-color .18s, background .18s; }
  .card:hover { border-color: var(--dim); background: var(--panel-2); }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card .sym { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  .card .dir { font-size: 12px; font-weight: 600; margin-left: 8px; color: var(--buy); }
  .dir.SELL { color: var(--sell); }
  .card .strat { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .lv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 15px; border-top: 1px solid var(--line); padding-top: 12px; }
  .lv > div { min-width: 0; padding: 0 12px; border-left: 1px solid var(--line); }
  .lv > div:first-child { padding-left: 0; border-left: 0; }
  .lv .k, .lv .n { background: none; border: 0; padding: 0; }
  .lv .k { font-size: 12px; font-weight: 500; color: var(--dim); }
  .lv .n { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 3px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .lv .n.tp { color: var(--win); } .lv .n.sl { color: var(--loss); }
  .lv-usd { font-size: 12.5px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .lv-usd.win { color: var(--win); } .lv-usd.loss { color: var(--loss); }
  .pnl-row { border-top: 1px solid var(--line); }
  .card .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 13px; font-size: 12.5px; color: var(--dim); }

  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--muted); }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .badge.green, .badge.emerald { color: var(--win); }
  .badge.red { color: var(--loss); }
  .badge.yellow { color: var(--gold); }
  .badge.blue, .badge.cyan { color: var(--cyan); }
  .badge.gray, .badge.slate { color: var(--dim); }
  .badge.orange { color: var(--amber); }
  .badge.teal { color: var(--teal); }
  .empty { color: var(--dim); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; font-size: 13.5px; line-height: 1.6; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th, td { text-align: left; padding: 14px 16px 14px 0; font-size: 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
  th {
    color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap; padding-bottom: 10px;
    position: sticky; top: 0; background: var(--ground); z-index: 2;
  }
  tbody tr { transition: background .18s var(--ease); }
  tbody tr:hover td { background: var(--panel); }
  .r-buy { color: var(--buy); font-weight: 600; } .r-sell { color: var(--sell); font-weight: 600; }
  .tbl-wrap {
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(100vh - 380px);
    min-height: 200px;
    overscroll-behavior: contain;
    overscroll-behavior-y: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
  }
  .tbl-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
  .tbl-wrap::-webkit-scrollbar-track { background: transparent; }
  .tbl-wrap::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .tbl-wrap::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  td[data-l="SIGNAL"] { white-space: nowrap; font-weight: 600; }
  .why { font-size: 13px; line-height: 1.5; color: var(--dim); margin-top: 5px; max-width: 520px; }
  tbody tr { cursor: pointer; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
         padding: 2px 6px; border-radius: 5px; margin-left: 7px; vertical-align: 1px;
         background: rgba(245,158,11,.14); color: var(--gold); border: 1px solid rgba(245,158,11,.3); }

  .ov { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.62);
        backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center;
        padding: 5vh 16px 16px; overflow-y: auto; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
         width: min(780px, 100%); box-shadow: 0 40px 90px -30px rgba(0,0,0,.9); overflow: hidden;
         display: flex; flex-direction: column; max-height: calc(95vh - 16px); max-height: calc(95dvh - 16px); }
  .dlg-h { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; flex: none;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  .dlg-bar { flex: none; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .dlg-h h3 { font-size: 16px; letter-spacing: -.02em; margin: 0 0 3px; }
  .dlg-h .sub { font-size: 12.5px; color: var(--muted); }
  .dlg-x { margin-left: auto; cursor: pointer; border: 1px solid var(--line); background: none;
           color: var(--muted); border-radius: 9px; width: 40px; height: 40px; font-size: 15px; line-height: 1; }
  .dlg-x:hover { color: var(--text); border-color: var(--dim); }
  .dlg-b { padding: 4px 18px 18px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .sec { margin-top: 16px; }
  .sec > .st { font-size: 12px; font-weight: 700; letter-spacing: .09em; color: var(--muted);
               text-transform: uppercase; margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px 14px; }
  .kv > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .kv .k { font-size: 12px; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; }
  .kv .v { font-size: 14px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; line-height: 1.6; color: var(--dim); background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .note.warn { border-color: rgba(245,158,11,.35); }
  .exc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 13px 11px; }
  .exc-track { position: relative; height: 30px; margin: 4px 0 2px; }
  .exc-rail { position: absolute; top: 13px; left: 0; right: 0; height: 4px; border-radius: 3px; background: var(--line); }
  .exc-span { position: absolute; top: 13px; height: 4px; border-radius: 3px;
              background: linear-gradient(90deg, var(--loss), var(--win)); opacity: .5; }
  .exc-tick { position: absolute; top: 6px; width: 2px; height: 18px; border-radius: 1px; transform: translateX(-1px); }
  .exc-dot { position: absolute; top: 9px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-6px); }
  .exc-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: .05em; }
  .exc-line { font-size: 13px; line-height: 1.65; color: var(--dim); margin-top: 9px; }
  .exc-line b { font-variant-numeric: tabular-nums; }
  .note b { color: var(--text); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }
  .note li { margin-top: 4px; }

  .sdlg { width: min(720px, 100%); }
  .srange { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
  .srange .chip { font: inherit; font-size: 13px; font-weight: 600; }
  .srange .dates { max-width: 100%; }
  .srange .dates input { min-width: 0; flex: 1 1 128px; }
  .stot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
  .stot-n { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 6px; }
  .stot-sub { font-size: 13px; line-height: 1.6; color: var(--muted); text-align: right; }
  .stot-sub b { color: var(--text); font-weight: 600; }
  .srows { display: grid; gap: 10px; margin-top: 14px; }
  .srow { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px 12px; }
  .srow.quiet .srow-name b { color: var(--muted); }
  .srow-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .srow-name { min-width: 0; }
  .srow-name b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .srow-sym { font-size: 12px; color: var(--dim); margin-top: 3px; overflow-wrap: anywhere; }
  .srow-usd { font-size: 20px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .stag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.5; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 8px; vertical-align: 1px; white-space: nowrap; }
  .stag.open { color: var(--cyan); border-color: currentColor; }
  .sbar { position: relative; height: 8px; margin: 12px 0 9px; }
  .sbar::before { content: ""; position: absolute; left: 0; right: 0; top: 3.5px; height: 1px; background: var(--line); }
  .sbar-zero { position: absolute; left: 50%; top: -3px; width: 2px; height: 14px; margin-left: -1px; border-radius: 1px; background: var(--line-2); }
  .sbar-fill { position: absolute; top: 0; height: 8px; max-width: calc(50% - 3px); }
  .sbar-fill.up { left: 50%; margin-left: 3px; background: var(--win); border-radius: 0 4px 4px 0; }
  .sbar-fill.down { right: 50%; margin-right: 3px; background: var(--loss); border-radius: 4px 0 0 4px; }
  .sline { font-size: 13px; line-height: 1.6; color: var(--muted); }
  .sline b { color: var(--text); font-weight: 600; }
  .snote { font-size: 12.5px; line-height: 1.6; color: var(--dim); margin-top: 14px; }
  @media (max-width: 560px) { .stot-sub { text-align: left; } .srow-usd { font-size: 18px; } }
  @media (max-width: 560px) { .ov { padding: 0; } .dlg { border-radius: 0; height: 100%; max-height: none; } }

  .newsbar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; width: 100%;
             margin: 0 0 26px; padding: 12px 15px; text-align: left; cursor: pointer;
             background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
             color: inherit; font: inherit; transition: border-color .2s var(--ease); }
  .newsbar:hover { border-color: var(--line-2); }
  .newsbar .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .newsbar .ttl { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .newsbar .when { font-size: 13px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .newsbar.hot { border-color: rgba(255, 69, 58, .45); }
  .newsbar.hot .lbl, .newsbar.hot .when { color: var(--loss); }

  .imp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--dim); }
  .imp::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; flex: none; }
  .imp.high { color: var(--loss); }
  .imp.medium { color: var(--amber); }
  .imp.holiday { color: var(--teal); }

  .nday { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
          margin: 20px 0 2px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }

    var title = sig.status === 'ACTIVE'
      ? '⚡ TRADE OPENED — ' + esc(sig.symbol) + ' ' + esc(sig.direction)
      : esc(m.icon) + ' ' + esc(sig.symbol) + ' ' + esc(sig.direction) + ' — ' + esc(m.label);
    toast(cls, title, esc(sig.strategy || '') + (sig.serialNum ? ' · ' + esc(sig.serialNum) : '') + '<br>' + levels);

  var TRADE_STATUSES = { ACTIVE: 1, TP_HIT: 1, SL_HIT: 1, BE_EXIT: 1, TRAIL_EXIT: 1, RULE_EXIT: 1, BROKER_CLOSED: 1 };
  function maybeAlert(sig) {
    if (seen === null || !sig || sig.id == null) return; // history is not news
    var prev = seen[sig.id];
    seen[sig.id] = sig.status;
    if (!TRADE_STATUSES[sig.status]) return; // forming, cancelled, expired — silent
    if (prev === sig.status) return;         // a replay is not news
    fireAlert(sig);
  }

  function askKey(msg) {
    app.innerHTML =
      '<div class="keybox">' +
      '<div style="font-size:34px">🔐</div>' +
      '<h1 style="font-size:17px;margin-top:8px">AuraTrade Capital Desk</h1>' +
      '<p style="color:var(--muted);font-size:12.5px;margin-top:6px">Enter the access key you were given, or open the invite link again.</p>' +
      '<input id="k" type="password" placeholder="Access key" autocomplete="off">' +

  var NON_TRADE = { CANCELLED: 1, EXPIRED: 1 };
  function isTrade(s) { return !!s.activatedAt && !NON_TRADE[s.status]; }
  function endedAt(s) { return new Date(s.closedAt || s.timestamp).getTime(); }
  function inRange(s, b) { var t = endedAt(s); return t >= b.from && t <= b.to; }

  function rangeBar(b) {
    var oldest = signals.length ? Math.min.apply(null, signals.map(function (s) { return new Date(s.timestamp).getTime(); })) : null;
    var truncated = oldest != null && signals.length >= 190 && b.from < oldest;
    var chip = function (mode, text) { return '<span class="chip ' + (range.mode === mode ? 'on' : '') + '" data-mode="' + mode + '">' + text + '</span>'; };
    return '<div class="range">' +
      '<span class="lbl">RANGE</span>' +
      chip('7d', '7D') + chip('14d', '14D') + chip('30d', '30D') + chip('all', 'ALL') +

      (truncated ? '<span class="note">This page holds the last ' + signals.length + ' signals — older trades than that are not on it.</span>' : '') +
      '</div>';
  }

  function equityCurve(b) {
    var rows = signals.filter(function (s) {
      return meta(s.status).terminal && isTrade(s) && inRange(s, b) && isFinite(Number(s.realizedUsd));
    }).sort(function (x, y) { return endedAt(x) - endedAt(y); });
    if (rows.length < 2) {
      return '<div class="curve-empty">A curve needs at least two closed trades taken on the account in this window.</div>';
    }
    var cum = 0;
    var pts = [0];
    rows.forEach(function (s) { cum += Number(s.realizedUsd); pts.push(cum); });
    var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    var W = 640, H = 116, P = 8;
    var span = (max - min) || 1;
    var X = function (i) { return P + i * (W - P * 2) / (pts.length - 1); };
    var Y = function (v) { return P + (max - v) * (H - P * 2) / span; };
    var line = pts.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    var area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + (H - P) + ' L' + X(0).toFixed(1) + ' ' + (H - P) + ' Z';
    var zero = (min < 0 && max > 0)
      ? '<line class="zero" x1="' + P + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - P) + '" y2="' + Y(0).toFixed(1) + '"/>'
      : '';
    return '<div class="curve-wrap' + (cum < 0 ? ' down' : '') + '">' +
      '<svg class="curve" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Cumulative profit and loss in dollars over the selected range">' +
      '<defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="currentColor" stop-opacity=".20"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/>' +
      '</linearGradient></defs>' + zero +
      '<path d="' + area + '" fill="url(#eqfill)"/>' +
      '<path d="' + line + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(pts[pts.length - 1]).toFixed(1) + '" r="3.2" fill="currentColor"/>' +
      '</svg>' +
      '<div class="curve-cap"><span>' + rows.length + ' trade' + (rows.length === 1 ? '' : 's') + ' on the account</span><span>peak ' + money(max) + '  ·  low ' + money(min) + '</span></div>' +
      '</div>';
  }

  function plain(name) { return String(name || '').replace(/^[^A-Za-z0-9(]+/, '').trim(); }

  function whyBits(s) {
    var raw = String(s.statusReason || '').trim();
    var corrected = !!s.correction || /CORRECTED\s+\d{4}-\d{2}-\d{2}/.test(raw);
    var head = raw.split(/\s*CORRECTED\s+\d{4}-\d{2}-\d{2}\s*:/)[0].trim();
    if (head.length > 96) {
      var cut = head.slice(0, 96);
      var sp = cut.lastIndexOf(' ');
      head = (sp > 40 ? cut.slice(0, sp) : cut) + '…';
    }
    return { text: head, corrected: corrected };
  }

  function when(iso) {
    if (!iso) return '—';

  }

  function held(s) {
    var a = Date.parse(s.activatedAt || s.timestamp), b = Date.parse(s.exitTime || s.closedAt || '');
    if (!a) return '—';
    if (!b || b < a) {
      if (s.status === 'ACTIVE') {

        return (mins < 60 ? mins + 'm' : (mins / 60).toFixed(1) + 'h') + ' (open)';
      }
      return '—';
    }
    var mins = Math.round((b - a) / 60000);
    return mins < 60 ? mins + 'm' : (mins / 60).toFixed(1) + 'h';
  }

  function kv(k, v) { return '<div><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div></div>'; }

  function details(s) {
    var m = meta(s.status);
    var isBuy = String(s.direction).toUpperCase().indexOf('BUY') === 0;
    var u = moneyOf(s);
    var ps = s.positionSize || {};
    var notTaken = s.status === 'ACTIVE' && !onAccount(s);
    var perPoint = numOrNull(s.openRange ? s.openRange.usdPerPoint : null);
    if (!(perPoint > 0)) perPoint = null;
    var tgt = Number(s.tp != null ? s.tp : s.tp2);
    var fillPx = Number(s.fillPrice) > 0 ? Number(s.fillPrice) : Number(s.activationPrice != null ? s.activationPrice : s.entry);
    var tgtDir = String(s.direction).toUpperCase().indexOf('SELL') >= 0 ? -1 : 1;
    var targetMoney = (perPoint != null && isFinite(tgt) && isFinite(fillPx))
      ? (tgt - fillPx) * tgtDir * perPoint
      : null;
    var stopPx = Number(s.originalSl != null ? s.originalSl : s.sl);
    var stopMoney = (perPoint != null && isFinite(stopPx) && isFinite(fillPx))
      ? (stopPx - fillPx) * tgtDir * perPoint
      : null;
    var ai = s.aiReview || {};
    var c = s.correction || null;
    var moved = s.originalSl != null && Number(s.originalSl) !== Number(s.sl);

    var money2 = function (v) {
      if (v == null || !isFinite(v)) return '<span style="color:var(--muted)">—</span>';
      var col = v > 0.005 ? 'var(--win)' : v < -0.005 ? 'var(--loss)' : 'var(--gold)';
      return '<span style="color:' + col + '">' + money(v) + '</span>';
    };

    var out = '';
    out += '<div class="sec"><div class="st">The order</div><div class="kv">' +
      kv('Side', '<span class="' + (isBuy ? 'r-buy' : 'r-sell') + '">' + esc(s.direction) + '</span>') +
      kv('Entry planned', fnum(s.entry)) +
      kv('Filled at', notTaken ? '<span style="color:var(--muted)">not traded</span>' : (livePnl[s.id] && livePnl[s.id].resting && !(Number(s.fillPrice) > 0)) ? '<span style="color:var(--muted)">order waiting at ' + fnum(s.entry) + '</span>' : Number(s.fillPrice) > 0 ? fnum(s.fillPrice) : s.activationPrice ? fnum(s.activationPrice) : '<span style="color:var(--muted)">not filled</span>') +
      kv('Stop', fnum(s.originalSl != null ? s.originalSl : s.sl)) +
      kv('Target', fnum(s.tp != null ? s.tp : s.tp2)) +
      kv('Stop loss', stopMoney != null ? '<b style="color:' + (stopMoney < -0.005 ? 'var(--loss)' : 'var(--text)') + '">' + money(stopMoney) + '</b>' : '—') +
      kv('Take profit', targetMoney != null ? '<b style="color:var(--win)">' + money(targetMoney) + '</b>' : '—') +
      kv('Order type', esc(s.orderType || s.entryType || 'MARKET')) +
      '</div></div>';

    var activeRes = null;
    if (s.status === 'ACTIVE') {
      var f = livePnl[s.id];
      if (f && isFinite(f.usd)) {

      } else if (!onAccount(s)) {
        var sym = s.symbol;
        var tp = (typeof tickerPrices !== 'undefined' && tickerPrices) ? (tickerPrices[sym] || tickerPrices[sym + 'm'] || tickerPrices[String(sym || '').replace(/m$/, '')]) : null;
        var p = (typeof plannedUsd === 'function') ? plannedUsd(s) : null;
        var curPx = tp && (Number(tp.price) || Number(tp.bid) || Number(tp.ask));
        var e = Number(s.entry), sl = Number(s.sl);
        if (curPx && isFinite(curPx) && p && isFinite(p.stop) && p.stop > 0 && isFinite(e) && isFinite(sl) && Math.abs(e - sl) > 0) {
          var isBuyDir = String(s.direction || '').toUpperCase().indexOf('SELL') < 0;
          var curMove = isBuyDir ? (curPx - e) : (e - curPx);
          var sigCurUsd = (curMove / Math.abs(e - sl)) * p.stop;
          activeRes = money2(sigCurUsd) + '<span style="color:var(--muted);font-size:12px;margin-left:4px">(signal live)</span>';
        }
      }
    }

    out += '<div class="sec"><div class="st">On the account</div><div class="kv">' +
      kv('Size', ps.lots && !notTaken ? esc(ps.lots) + ' lots' : '<span style="color:var(--muted)">not traded</span>') +
      kv('Risked', ps.riskAmount != null && !notTaken ? '$' + Number(ps.riskAmount).toFixed(2) : '—') +
      kv('Result', (s.status === 'ACTIVE' && activeRes) ? activeRes : money2(u != null && isFinite(u) ? u : null)) +
      kv('Price move', isFinite(Number(s.exitPrice)) ? fnum(moveOf(s)) + ' pts' : '—') +
      kv('Exit price', s.exitPrice ? fnum(s.exitPrice) : '—') +
      kv('Held for', held(s)) +
      '</div></div>';

    out += '<div class="sec"><div class="st">Timeline</div><div class="kv">' +
      kv('Signalled', when(s.timestamp)) +
      kv('Filled', when(s.activatedAt)) +
      kv('Closed', when(s.exitTime || s.closedAt)) +
      '</div></div>';

    var orng = s.openRange || null;
    if (orng) {
      var rangeCell = function (usd, move, sign) {
        var col = sign > 0 ? 'var(--win)' : 'var(--loss)';
        if (usd != null && isFinite(Number(usd))) {
          var tail = (move != null && isFinite(Number(move)))
            ? ' <span style="color:var(--muted);font-weight:400">· ' + fnum(Math.abs(Number(move))) + ' pts</span>'
            : '';
          return '<b style="color:' + col + '">' + (sign > 0 ? '+$' : '−$') + Math.abs(Number(usd)).toFixed(2) + '</b>' + tail;
        }
        if (move != null && isFinite(Number(move))) {
          return '<b style="color:' + col + '">' + (sign > 0 ? '+' : '−') + fnum(Math.abs(Number(move))) + ' pts</b>';
        }
        return '<span style="color:var(--muted)">—</span>';
      };
      out += '<div class="sec"><div class="st">Between fill and close</div><div class="kv">' +

        kv('Low', rangeCell(orng.downUsd, orng.downMove, -1)) +

          'This trade was <b>$' + upUsd.toFixed(2) + '</b> up at its best, then came back and closed ' +
          (s.status === 'BE_EXIT' ? 'at break-even.' : 'at the stop.') +
          '</div>';

    }

    out += excursionCard(s);

    if (moved || s.breakevenAt) {
      out += '<div class="sec"><div class="st">The stop</div><div class="note' + (s.breakevenAt && !moved ? ' warn' : '') + '">' +
        'Opened at <b>' + fnum(s.originalSl) + '</b>' +
        (moved
          ? ', moved to <b>' + fnum(s.sl) + '</b>' + (s.breakevenAt ? ' at break-even on ' + esc(when(s.breakevenAt)) : '') + '.'
          : (s.breakevenAt
            ? '. Break-even was armed on ' + esc(when(s.breakevenAt)) +
              ', but the stop the broker held stayed where it opened — so this trade carried its full risk to the end.'
            : '.')) +
        '</div></div>';
    }

    out += '<div class="sec"><div class="st">Why it ended this way</div>' +
      '<div class="note">' + esc(String(s.statusReason || m.label)) + '</div></div>';

    if (c) {
      out += '<div class="sec"><div class="st">Record corrected</div><div class="note warn">' +
        'This record was rewritten on ' + esc(when(c.at)) + ' because the broker\'s own closing deal ' +
        'disagreed with it. The broker is the truth for a trade it held.' +
        '<ul>' +
        '<li>It used to read <b>' + esc(c.was && c.was.status) + '</b>' +
        (c.was && c.was.exitPrice ? ' at ' + fnum(c.was.exitPrice) : ' with no exit price') + '.</li>' +
        '<li>It now reads <b>' + esc(c.now && c.now.status) + '</b> at ' + fnum(c.now && c.now.exitPrice) +
        (c.now && c.now.profit != null ? ' for ' + money(Number(c.now.profit)) : '') + '.</li>' +
        (c.ticket ? '<li>Broker ticket ' + esc(c.ticket) + '.</li>' : '') +

        '<b>' + esc(ai.verdict) + '</b>' + (ai.confidence ? ' · ' + esc(ai.confidence) + '% sure' : '') +
        (ai.model ? ' · ' + esc(ai.model) : '') +
        (ai.summary ? '<div style="margin-top:6px">' + esc(ai.summary) + '</div>' : '') +
        (ai.reasons && ai.reasons.length

      '</div><button class="dlg-x" id="ovX" aria-label="Close">✕</button></div>' +

  function openDetails(id) {

  var news = null;

  function istTime(ms) {

  function istDay(ms) {

        timeZone: 'Asia/Kolkata', weekday: 'short', day: '2-digit', month: 'short',
      });
    } catch (e) { return ''; }
  }
  function until(ms, now) {
    var d = ms - now;
    if (d < 0) {
      var pm = Math.round(-d / 60000);
      if (pm < 60) return pm + 'm ago';
      var ph = Math.round(pm / 60);
      return ph < 24 ? ph + 'h ago' : Math.round(ph / 24) + 'd ago';
    }
    var m = Math.round(d / 60000);
    if (m < 60) return 'in ' + m + 'm';
    var h = Math.floor(m / 60);
    return h < 24 ? 'in ' + h + 'h ' + (m % 60) + 'm' : 'in ' + Math.round(h / 24) + 'd';
  }

  function isBig(e) { return e.impact === 'High' || e.impact === 'Medium'; }
  function newsEvents() { return (news && Array.isArray(news.events)) ? news.events : []; }
  function nextBig(now) {
    var up = newsEvents().filter(function (e) { return isBig(e) && e.time >= now; });
    return up.length ? up[0] : null;
  }
  function blackoutNow(now) {
    var hit = newsEvents().filter(function (e) {
      return e.impact === 'High'
        && now >= e.time - BLACKOUT.before * 60000
        && now <= e.time + BLACKOUT.after * 60000;
    });
    return hit.length ? hit[0] : null;

  function setBigOnly(v) { try { localStorage.setItem(NEWSBIG_LS, v ? 'on' : 'off'); } catch (e) {} }

  function newsBar(now) {
    if (!news) return '';

      return '<button class="newsbar hot" id="newsBar" type="button">'

        + '<span class="when">' + esc(istTime(blk.time)) + ' IST · ' + esc(until(blk.time, now)) + '</span>'

  function newsResult(verdict, movePct) {
    if (verdict !== 'hit' && verdict !== 'miss') return '';

      ? ' title="Moved ' + (Number(movePct) > 0 ? '+' : '') + Number(movePct).toFixed(2) + '% after the release"'
      : '';

      ? ' <span class="nres hit"' + mv + '>Right ✔</span>'
      : ' <span class="nres miss"' + mv + '>Miss ❌</span>';
  }

  function newsRow(e, now, mark) {
    var cls = e.impact === 'High' ? 'high' : e.impact === 'Medium' ? 'medium' : e.impact === 'Holiday' ? 'holiday' : 'low';
    var lab = e.impact === 'High' ? 'HIGH' : e.impact === 'Medium' ? 'MED' : e.impact === 'Holiday' ? 'HOL' : 'LOW';

    var vals = [];
    if (e.actual) vals.push('<span class="act"><b>A</b> ' + esc(e.actual) + '</span>');
    if (e.forecast) vals.push('<span><b>F</b> ' + esc(e.forecast) + '</span>');
    if (e.previous) vals.push('<span><b>P</b> ' + esc(e.previous) + '</span>');

    var call = '';
    var items = (e.bias && Array.isArray(e.bias.items)) ? e.bias.items : [];

  function newsBody(now) {

        ? 'The calendar feed did not answer (' + esc(news.error) + '). The host retries on its own.'
        : 'No events in the calendar right now.') + '</div>';
    }
    var list = bigOnly() ? all.filter(isBig) : all;
    if (!list.length) return '<div class="empty">Nothing red or orange this week.</div>';

    var days = [];
    var seen = {};
    list.forEach(function (e) {
      var d = istDay(e.time);
      if (seen[d] == null) { seen[d] = days.length; days.push({ day: d, events: [] }); }
      days[seen[d]].events.push(e);
    });

    var out = '';

  function openNews() {
    if (document.querySelector('#nov')) return;
    var host = document.createElement('div');
    var timer = null;
    host.innerHTML = newsDialog(Date.now());
    var ov = host.querySelector('#nov');
    host.querySelector('#novX').onclick = function () { close(); };
    ov.onclick = function (e) { if (e.target === ov) close(); };
    host.querySelector('#novBig').onclick = function () { setBigOnly(!bigOnly()); paint(); };
    var landed = false;
    var paint = function () {
      var box = host.querySelector('#novB');
      var keep = box.scrollTop;
      var perf = newsTab() === 'performance';
      if (perf) box.innerHTML = perfBody(newsPerf, perfSym());
      else box.innerHTML = newsBody(Date.now());
      host.querySelector('#novSub').innerHTML = newsSub(perf);
      host.querySelector('#novTitle').textContent = perf ? 'News performance' : 'Economic calendar';
      var big = host.querySelector('#novBig');
      big.className = 'chip ' + (bigOnly() ? 'on' : '');
      big.style.visibility = perf ? 'hidden' : '';
      host.querySelector('#novTabCal').className = 'chip ' + (perf ? '' : 'on');
      host.querySelector('#novTabPerf').className = 'chip ' + (perf ? 'on' : '');
      if (perf) { box.scrollTop = keep; return; }
      if (landed) { box.scrollTop = keep; return; }
      var here = box.querySelector('#nnow');
      if (!here) return;
      try { here.scrollIntoView({ block: 'center' }); } catch (e) {}
      landed = true;
    };
    var close = function () {
      if (timer) clearInterval(timer);
      try { document.body.removeChild(host); } catch (e) {}
      document.removeEventListener('keydown', onKey);
    };
    var onKey = function (e) { if (e.key === 'Escape') close(); };
    document.body.appendChild(host);
    paint();
    document.addEventListener('keydown', onKey);
    timer = setInterval(paint, 30000);
    var perfTimer = setInterval(function () {
      if (!document.body.contains(host)) { clearInterval(perfTimer); return; }
      if (newsTab() !== 'performance') return;
      loadNewsPerf().then(function (p) { if (p && document.body.contains(host)) paint(); });
    }, 60000);
    loadNews().then(function (n) { if (n && document.body.contains(host)) paint(); });
    host.querySelector('#novTabCal').onclick = function () {
      if (newsTab() === 'calendar') return;
      setNewsTab('calendar');
      landed = false;
      host.querySelector('#novB').scrollTop = 0;
      paint();
    };
    host.querySelector('#novTabPerf').onclick = function () {
      if (newsTab() !== 'performance') {
        setNewsTab('performance');
        host.querySelector('#novB').scrollTop = 0;
        paint();
      }
      loadNewsPerf().then(function () { if (document.body.contains(host)) paint(); });
    };
    host.querySelector('#novB').onclick = function (e) {
      if (e.target && e.target.id === 'retryNewsPerf') {
        newsPerfError = false;
        paint();
        loadNewsPerf().then(function () { if (document.body.contains(host)) paint(); });
        return;

      var chip = e.target && e.target.closest ? e.target.closest('[data-psym]') : null;
      if (!chip) return;
      setPerfSym(chip.getAttribute('data-psym'));
      paint();
    };
    loadNewsPerf().then(function () { if (document.body.contains(host) && newsTab() === 'performance') paint(); });
  }


  function tally(list, b) {
    var t = { wins: 0, losses: 0, be: 0, open: 0, netUsd: 0, priced: 0, closed: 0, best: null, worst: null };
    list.forEach(function (s) {
      if (!meta(s.status).terminal) { t.open++; return; }
      if (!isTrade(s) || !inRange(s, b)) return;
      t.closed++;
      var u = numOrNull(s.realizedUsd);
      if (u != null) {
        t.netUsd += u;
        t.priced++;
        if (t.best == null || u > t.best) t.best = u;
        if (t.worst == null || u < t.worst) t.worst = u;
      }
      var res = meta(s.status).outcome;
      if (res === 'none') { t.closed--; return; }   // never entered — not a trade
      if (res == null) {
        var m = moneyOf(s);
        var v = m != null ? m : Number(s.realizedRR);
        res = !isFinite(v) || Math.abs(v) <= 0.005 ? 'flat' : (v > 0 ? 'win' : 'loss');
      }
      if (res === 'win') t.wins++;
      else if (res === 'loss') t.losses++;
      else t.be++;
    });
    return t;
  }

  function strategyBook(cat, list, b) {
    var groups = {};
    var order = [];
    var ensure = function (id, name, c) {
      if (!groups[id]) {
        groups[id] = {
          id: id,
          name: plain(name) || 'Unnamed strategy',
          symbols: c && Array.isArray(c.symbols) ? c.symbols : null,
          anySymbol: !!(c && !c.symbols),
          alertOnly: !!(c && c.alertOnly === true),
          registered: !!c || !(cat && cat.length),
          signals: [],
          rank: order.length
        };
        order.push(id);
      }
      return groups[id];
    };
    (cat || []).forEach(function (c) { if (c && c.id) ensure(String(c.id), c.name, c); });
    list.forEach(function (s) {
      ensure(s.strategyId ? String(s.strategyId) : 'unnamed:' + plain(s.strategy), s.strategy, null).signals.push(s);
    });
    return order.map(function (id) {
      var g = groups[id];
      g.t = tally(g.signals, b);
      return g;
    }).sort(function (x, y) {
      var xm = x.t.priced > 0, ym = y.t.priced > 0;
      if (xm !== ym) return xm ? -1 : 1;
      return (xm ? y.t.netUsd - x.t.netUsd : 0) || x.rank - y.rank;
    });
  }

  var stratList = null;   // the engine's own list, from /api/strategies once the panel has opened

  function signCol(v) { return v > 0.005 ? 'var(--win)' : v < -0.005 ? 'var(--loss)' : 'var(--text)'; }

  function strategyRow(g, widest) {
    var t = g.t;
    var traded = t.priced > 0;
    var decided = t.wins + t.losses;
    var tags = '';
    if (!g.registered) tags += '<span class="stag">No longer running</span>';
    else if (g.alertOnly) tags += '<span class="stag">Alerts only</span>';
    if (t.open) tags += '<span class="stag open">' + t.open + ' open now</span>';
    var syms = g.symbols && g.symbols.length ? g.symbols.join(' · ') : (g.anySymbol ? 'All scanned symbols' : '');
    var half = traded && widest > 0 ? Math.max(1.5, Math.abs(t.netUsd) / widest * 50) : 0;
    var bar = '<div class="sbar" aria-hidden="true"><i class="sbar-zero"></i>'
      + (traded ? '<i class="sbar-fill ' + (t.netUsd < 0 ? 'down' : 'up') + '" style="width:' + half.toFixed(1) + '%"></i>' : '')
      + '</div>';
    var lines = '<div class="sline">No closed trades in this range.</div>';
    if (t.closed) {
      lines = '<div class="sline"><b>' + t.wins + '</b> won · <b>' + t.losses + '</b> lost · <b>' + t.be + '</b> break-even'
        + (decided ? ' · <b>' + Math.round((t.wins / decided) * 100) + '%</b> win rate' : '') + '</div>'
        + '<div class="sline">' + (traded
          ? '<b>' + t.priced + '</b> trade' + (t.priced === 1 ? '' : 's') + ' on the account'
            + (t.priced > 1 ? ' · best <b>' + money(t.best) + '</b> · worst <b>' + money(t.worst) + '</b>' : '')
            + (t.priced < t.closed ? ' · ' + (t.closed - t.priced) + ' not traded' : '')
          : 'Not traded on the account in this range, so there is no dollar figure.')
        + '</div>';
    }
    return '<div class="srow' + (t.closed || t.open ? '' : ' quiet') + '" title="' + esc(g.name + (traded ? ': ' + money(t.netUsd) + ' in this range' : '')) + '">'
      + '<div class="srow-top"><div class="srow-name"><b>' + esc(g.name) + '</b>' + tags
      + (syms ? '<div class="srow-sym">' + esc(syms) + '</div>' : '') + '</div>'
      + '<div class="srow-usd" style="color:' + (traded ? signCol(t.netUsd) : 'var(--muted)') + '">' + (traded ? money(t.netUsd) : '—') + '</div></div>'
      + bar + lines + '</div>';

    var chip = function (mode, text) {

      + '<div class="dlg-b"><div id="sovData"></div></div>'

  function strategyData(b) {
    var rows = strategyBook(stratList, signals, b);
    var all = tally(signals, b);
    var widest = 0;
    rows.forEach(function (g) { if (g.t.priced) widest = Math.max(widest, Math.abs(g.t.netUsd)); });
    var foot = 'Money is what the broker booked when each trade closed, so only trades placed on the account carry a dollar figure. '

  function numOrNull(v) {
    if (v == null || v === '') return null;

  function moneyOf(s) {
    var broker = numOrNull(s.realizedUsd);
    if (broker != null) return broker;
    var per = numOrNull(s.openRange ? s.openRange.usdPerPoint : null);
    var fill = Number(s.fillPrice) > 0 ? Number(s.fillPrice) : Number(s.activationPrice != null ? s.activationPrice : s.entry);
    var exit = Number(s.exitPrice);
    if (!(per > 0) || !isFinite(fill) || !isFinite(exit)) return null;
    var dir = String(s.direction).toUpperCase().indexOf('SELL') >= 0 ? -1 : 1;
    return (exit - fill) * dir * per;
  }

  function moveOf(s) {
    var fill = Number(s.fillPrice) > 0 ? Number(s.fillPrice) : Number(s.activationPrice != null ? s.activationPrice : s.entry);
    var exit = Number(s.exitPrice);

  function idParts(v) {

  function plannedUsd(s) {
    var entry = Number(s.entry);
    var sl = Number(s.sl);
    if (!isFinite(entry) || !isFinite(sl)) return null;

    var ps = s.positionSize || {};
    var per = s.openRange && Number(s.openRange.usdPerPoint);
    if (!isFinite(per) || per <= 0) per = Number(ps.usdPerPoint);
    if (!isFinite(per) || per <= 0) {

      var dist = Math.abs(entry - sizedAgainst);

    if (ps.viable === false && (!isFinite(per) || per <= 0)) {

  function excursionCard(s) {
    var ex = s && s.excursion;

    var risk = Number(ex.risk);
    var fav = Number(ex.maxFavourable);
    var adv = Number(ex.maxAdverse);
    if (!isFinite(risk) || risk <= 0 || !isFinite(fav) || !isFinite(adv)) return '';

    var entry = Number(ex.entry);
    var favR = fav / risk;
    var advR = adv / risk;
    var tp = Number(s.tp != null ? s.tp : s.tp1);
    var tpR = (isFinite(tp) && isFinite(entry)) ? Math.abs(tp - entry) / risk : null;

    var hi = Math.max(tpR != null ? tpR : 0, favR, 0.5) * 1.08;
    var pos = function (r) { return Math.max(0, Math.min(100, ((r - lo) / (hi - lo)) * 100)); };

    var pFav = pos(favR), pAdv = pos(-advR), pEntry = pos(0);

    var bar = '<div class="exc-track">'

      + '</div>'

    var towardTp = (tpR != null && tpR > 0) ? (favR / tpR) * 100 : null;
    var towardSl = advR * 100;
    var leftToSl = Math.max(0, risk - adv);
    var leftToTp = (tpR != null && isFinite(tp)) ? Math.max(0, Math.abs(tp - entry) - fav) : null;

  var BEACON_HOSTS = ['https://textdb.dev/api/data/', 'https://textdb.online/'];

  var enc = new TextEncoder();
  function hex(buf) { return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
  async function beaconKey() { return 'auratrade-' + hex(await crypto.subtle.digest('SHA-256', enc.encode('auratrade-beacon:' + key()))).slice(0, 24); }
  async function hmacHex(text) {
    var k = await crypto.subtle.importKey('raw', enc.encode(key()), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return hex(await crypto.subtle.sign('HMAC', k, enc.encode(text)));

  async function readBeacon() {
    var bk = await beaconKey();
    for (var i = 0; i < BEACON_HOSTS.length; i++) {
      try {
        var r = await fetch(BEACON_HOSTS[i] + bk, { signal: AbortSignal.timeout(6000), cache: 'no-store' });
        if (!r.ok) continue;
        var rec = await r.json();
        if (!rec || typeof rec.url !== 'string' || !rec.sig || rec.url.indexOf('https://') !== 0) continue;
        var at = Number(rec.at);
        if (!isFinite(at) || Date.now() - at > BEACON_MAX_AGE) continue;
        if ((await hmacHex(rec.url + '|' + at)) !== String(rec.sig)) continue;
        return rec.url.replace(/[/]+$/, '');
      } catch (e) { /* next store */ }
    }
    return null;

    banner.id = 'mobile-saved-banner';
    banner.setAttribute('role', 'status');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#302716;color:#ffe6a0;padding:12px 16px;font:600 13px/1.5 system-ui;border-bottom:1px solid #92723a';
    banner.textContent = 'Saved data — live update pending. Saved at ' + new Date(d.at).toLocaleString() + '. Prices and statuses may have changed.';
    document.body.appendChild(banner);
  }
  window.addEventListener('message', function (ev) {
    if (ev.source !== window.parent || ev.origin !== location.origin) return;
    var d = ev.data;
    if (!d || d.auratrade !== true) return;
    if (d.type === 'mobile-preview') { showMobileSavedView(d); return; }
    if (d.type !== 'mobile-connect' || mobileConfig) return;
    if (typeof d.base !== 'string' || d.base.indexOf('https://') !== 0 || typeof d.key !== 'string' || !Array.isArray(d.snapshot)) return;
    mobileConfig = d;
    serverBase = d.base;
    boot();
  });
  post({ type: 'mobile-ready' });
})();
</script>
</body>
</html>
