<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AuraTrade Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AuraTrade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #dbe2ef;
               font: 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #0b0e14; }
  #shade { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e14; }
  .card { text-align: center; padding: 34px 26px; max-width: 420px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px;
          background: linear-gradient(135deg, #2b6cff, #7b2bff); display: grid; place-items: center;
          font-weight: 800; font-size: 26px; color: #fff; }
  h1 { font-size: 17px; letter-spacing: .08em; margin: 0 0 6px; }
  #st { color: #7c8698; font-size: 13px; min-height: 44px; }
  .spin { width: 22px; height: 22px; border: 3px solid #232c3e; border-top-color: #4b8bff; border-radius: 50%;
          margin: 16px auto 0; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  button { margin-top: 16px; background: linear-gradient(135deg, #2b6cff, #7b2bff); color: #fff; border: 0;
           border-radius: 10px; padding: 11px 22px; font-size: 14px; font-weight: 700; cursor: pointer; display: none; }
  .tip { margin-top: 18px; font-size: 12px; color: #5d6779; line-height: 1.5; }
</style>
</head>
<body>
<iframe id="frame" title="AuraTrade Desk" allow="autoplay"></iframe>
<div id="shade">
  <div class="card">
    <div class="logo">A</div>
    <h1>AURATRADE CAPITAL DESK</h1>
    <div id="st">Finding the live desk…</div>
    <div class="spin" id="sp"></div>
    <button id="retry">Try again</button>
    <div class="tip" id="tip">Chrome menu → <b>Add to Home screen</b>. After that the icon opens the desk directly.</div>
  </div>
</div>
<script>
(function () {
  'use strict';

  /**
   * THE DESK LAUNCHER.
   *
   * WHY THIS PAGE HOLDS THE DESK IN A FRAME instead of navigating to it.
   * The tunnel's address is EPHEMERAL — localhost.run hands out a new random
   * subdomain on every reconnect. The old launcher did location.replace() to
   * that address, which put it in the address bar, the tab restore and the
   * autocomplete. So the first open worked and the second landed the friend
   * on a dead subdomain showing localhost.run's own "no tunnel here :(" page
   * — reported by two people on 2026-09-05, and unfixable from that page
   * because it is not ours. Now the top-level URL is always THIS file, and
   * only the frame inside it points at whatever address is live right now.
   *
   * It also self-heals: the beacon is re-read on a timer, and if the tunnel
   * has moved (or died and come back at a new address) the frame is pointed
   * at the new one without anybody reloading anything.
   */

  /**
   * TWO BUILDS OF ONE PAGE. The Frds file bakes the key in (it is handed
   * out privately). The PUBLIC build — hosted at a stable https address so
   * phones can "Add to Home screen" (his 2026-09-06 ask: opening a file every
   * time is not workable) — bakes NOTHING: the key arrives once via ?key= on
   * the invite link, is stored under this stable origin and stripped from
   * the address bar, or is typed once into the box below. The beacon's own
   * name is derived from the key at runtime, so the public page reveals
   * neither the key nor where the beacon lives.
   */
  var KEY_BAKED = null;
  var KEY_LS = 'auratrade-launcher-key';
  var KEY = KEY_BAKED;
  var BEACON_READS = [];
  var MAX_AGE_MS = 1800000;
  var FIXED = "https://auratrade-signals-pro.loca.lt";
  var RECHECK_MS = 45000;
  var MOBILE_SHELL = true;
  var mobileSnapshots = {};
  var savedMobileViewShown = false;
  function mobileViewStorageKey() { return 'auratrade-mobile-view-v1-' + sha256HexJs('saved-view:' + KEY); }
  function readSavedMobileView() {
    if (!KEY) return null;
    try {
      var saved = JSON.parse(localStorage.getItem(mobileViewStorageKey()) || 'null');
      if (!saved || !Array.isArray(saved.snapshot) || typeof saved.at !== 'number' || !isFinite(saved.at) || saved.at > Date.now() || Date.now() - saved.at > 24 * 60 * 60 * 1000) return null;
      return saved;
    } catch (e) { return null; }
  }
  function saveMobileView(snapshot) {
    if (!MOBILE_SHELL || !KEY || !Array.isArray(snapshot)) return;
    try { localStorage.setItem(mobileViewStorageKey(), JSON.stringify({ at: Date.now(), snapshot: snapshot })); } catch (e) {}
  }
  function previewMobileView() {
    if (!MOBILE_SHELL || !mobileShellReady || mobileShellConnected || savedMobileViewShown) return;
    var saved = readSavedMobileView();
    if (!saved) return;
    savedMobileViewShown = true;
    frame.style.display = 'block';
    shade.style.display = 'none';
    frame.contentWindow.postMessage({ auratrade: true, type: 'mobile-preview', key: KEY, snapshot: saved.snapshot, at: saved.at }, location.origin);
    connectionTrace('Saved view shown; fresh data pending');
  }
  var connectionStartedAt = Date.now();
  var connectionLog = [];
  var diagnosticMode = new URLSearchParams(location.search).get('diagnostics') === '1';
  function connectionTrace(label) {
    if (!diagnosticMode) return;
    connectionLog.push(((Date.now() - connectionStartedAt) / 1000).toFixed(1) + 's ' + label);
    if (connectionLog.length > 18) connectionLog.shift();
    var panel = document.getElementById('connection-check');
    var output = document.getElementById('connection-log');
    if (panel && output) { panel.style.display = 'block'; panel.open = true; output.textContent = connectionLog.join(String.fromCharCode(10)); }
  }
  function connectionLabel(url) {
    if (url.indexOf('textdb.dev') >= 0) return 'Address lookup A';
    if (url.indexOf('textdb.online') >= 0) return 'Address lookup B';
    if (url.indexOf('/api/signals') >= 0) return url.indexOf('.loca.lt') >= 0 ? 'Data via shared address' : 'Data via backup address';
    return 'Connection check';
  }
  var mobileProbeControllers = {};
  function cancelMobileProbes(winner) {
    Object.keys(mobileProbeControllers).forEach(function (url) {
      if (url.indexOf(winner + '/api/signals') === 0) return;
      try { mobileProbeControllers[url].abort(); } catch (e) {}
      delete mobileProbeControllers[url];
    });
  }

  var st = document.getElementById('st');
  var sp = document.getElementById('sp');
  var shade = document.getElementById('shade');
  var frame = document.getElementById('frame');
  var retry = document.getElementById('retry');
  var currentBase = null;
  var mobileShellStarted = false;
  var mobileShellReady = false;
  var mobileShellConnected = false;
  function prepareMobileShell() {
    if (!MOBILE_SHELL || mobileShellStarted) return;
    mobileShellStarted = true;
    frame.src = 'mobile-desk-v4.html';
  }
  function connectMobileShell() {
    if (!mobileShellReady || !currentBase || mobileShellConnected || !Array.isArray(mobileSnapshots[currentBase])) return;
    mobileShellConnected = true;
    savedMobileViewShown = false;
    frame.contentWindow.postMessage({ auratrade: true, type: 'mobile-connect', base: currentBase, key: KEY, snapshot: mobileSnapshots[currentBase] }, location.origin);
  }
  var frameReadyTimer = null;
  var failedFrames = {};
  function deskReady() {
    if (frameReadyTimer) clearTimeout(frameReadyTimer);
    frameReadyTimer = null;
  }
  function watchDeskReady(base) {
    deskReady();
    frameReadyTimer = setTimeout(function () {
      if (currentBase !== base) return;
      checkGeneration++;
      failedFrames[base] = Date.now() + 45000;
      currentBase = null;
      frame.style.display = 'none';
      shade.style.display = 'grid';
      searching('The desk page did not load. Trying another verified connection…');
      check(true);
    }, 20000);
  }
  var checking = false;
  var checkGeneration = 0;
  var checkAgain = false;
  var recheckTimer = null;

  /**
   * SHA-256 AND HMAC WITHOUT crypto.subtle, AND THIS IS NOT A PREFERENCE.
   *
   * crypto.subtle exists only in a SECURE CONTEXT. https is one, file:// is
   * one — content:// is not, and content:// is exactly what Telegram's
   * built-in viewer serves this file as when a friend taps it straight from
   * the chat instead of saving it first. On that one path, which is the path
   * most friends actually take, crypto.subtle is undefined: beaconReadsFor()
   * threw, nothing caught it, and the page sat on its spinner for ever. Two
   * phones, 2026-09-12, and neither person could have guessed why.
   *
   * So the platform version is not used at all, even where it exists. One
   * code path means one thing to test, and tests/launcherCrypto.test.mjs
   * evaluates the block below verbatim out of this file and compares it with
   * node:crypto — including the real access key and a real beacon record.
   * Hashing forty bytes in JS costs microseconds; there is nothing to win by
   * branching, and a branch is how "works on my phone" happens.
   */
  /* ---- portable SHA-256 begins (tests/launcherCrypto.test.mjs reads this block) ---- */
  function utf8(s) {
    // TextEncoder is not secure-context gated, but this page has already been
    // wrong once about what a hostile viewer provides, so it does not rely on it.
    if (typeof TextEncoder === 'function') return new TextEncoder().encode(s);
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length) {
        var cp = 0x10000 + ((c - 0xd800) << 10) + (s.charCodeAt(++i) - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return new Uint8Array(out);
  }
  function hexOf(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i++) s += (u8[i] < 16 ? '0' : '') + u8[i].toString(16);
    return s;
  }
  var K256 = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5,
    0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
    0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
    0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
    0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3,
    0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
    0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
    0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }
  function sha256Bytes(msg) {
    var h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var len = msg.length;
    var buf = new Uint8Array(Math.ceil((len + 9) / 64) * 64);
    buf.set(msg);
    buf[len] = 0x80;
    var dv = new DataView(buf.buffer);
    var bits = len * 8;
    dv.setUint32(buf.length - 8, Math.floor(bits / 4294967296));
    dv.setUint32(buf.length - 4, bits >>> 0);
    var w = new Uint32Array(64);
    for (var off = 0; off < buf.length; off += 64) {
      var i;
      for (i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (i = 16; i < 64; i++) {
        var x = w[i - 15], y = w[i - 2];
        var s0 = (rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3)) >>> 0;
        var s1 = (rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10)) >>> 0;
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (i = 0; i < 64; i++) {
        var S1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
        var ch = ((e & f) ^ (~e & g)) >>> 0;
        var t1 = (hh + S1 + ch + K256[i] + w[i]) >>> 0;
        var S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
        var maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
        var t2 = (S0 + maj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0; h[3] = (h[3] + d) >>> 0;
      h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
    }
    var out = new Uint8Array(32);
    var odv = new DataView(out.buffer);
    for (var j = 0; j < 8; j++) odv.setUint32(j * 4, h[j]);
    return out;
  }
  function hmacBytes(key, msg) {
    var k = key.length > 64 ? sha256Bytes(key) : key;
    var ip = new Uint8Array(64 + msg.length);
    var op = new Uint8Array(96);
    for (var i = 0; i < 64; i++) {
      var kb = i < k.length ? k[i] : 0;
      ip[i] = kb ^ 0x36;
      op[i] = kb ^ 0x5c;
    }
    ip.set(msg, 64);
    op.set(sha256Bytes(ip), 64);
    return sha256Bytes(op);
  }
  function sha256HexJs(text) { return hexOf(sha256Bytes(utf8(text))); }
  function hmacHexJs(secret, text) { return hexOf(hmacBytes(utf8(secret), utf8(text))); }
  /* ---- portable SHA-256 ends ---- */

  async function hmacHex(secret, text) { return hmacHexJs(secret, text); }

  // Same rules as shared/beacon.mjs verifyBeacon: https only, fresh, signature must match.
  /**
   * A SIGNED, IN-DATE RECORD IS PROOF THE HOST IS ALIVE, even when the address
   * in it is not usable. Only the host can sign one, and it republishes every
   * five minutes — so "we read a record from four minutes ago" and "that PC is
   * off" cannot both be true. He was shown exactly that contradiction on
   * 2026-09-12: this page said his host was off while he was sitting at it.
   *
   * Recorded BEFORE the https test, because a retraction (url 'none', signed
   * the same way) is the host talking too — it is the keeper saying "I am here
   * and I am between addresses", which is the most useful thing it can say.
   */
  var hostSpokeAt = 0;
  async function verify(record) {
    try {
      if (!record || typeof record.url !== 'string' || !record.sig) return null;
      var at = Number(record.at);
      if (!isFinite(at) || Date.now() - at > MAX_AGE_MS) return null;
      var expected = await hmacHex(KEY, record.url + '|' + at);
      if (expected !== String(record.sig)) return null;
      if (at > hostSpokeAt) hostSpokeAt = at;
      if (!/^https:\/\//.test(record.url)) return null;
      return record.url.replace(/\/+$/, '');
    } catch (e) { return null; }
  }

  /**
   * A DEADLINE THAT DOES NOT DEPEND ON AbortSignal.timeout.
   *
   * That helper is Chrome 103+. Telegram's viewer and older Android WebViews
   * are below it, so building the option threw before fetch was even called —
   * or, on the builds where it is simply absent, fetch ran with NO deadline
   * at all and a request the viewer never answers hung for ever. check()
   * awaited that, its "checking" guard stayed true, and every later poll
   * returned at the first line. That is the frozen "Reading the beacon..."
   * spinner in his second screenshot: nothing on that screen was broken
   * except this.
   *
   * sawResponse records whether ANY http response reached its headers,
   * whatever its status. False after a full round means this page cannot reach the
   * internet from where it was opened — a different problem from the desk
   * being down, and it gets a different screen.
   * The timer remains active through JSON parsing: a store or tunnel that sends
   * headers but stalls its body must not hold the whole launcher indefinitely.
   */
  var sawResponse = false;
  function fetchT(url, ms) {
    var requestLabel = connectionLabel(url);
    connectionTrace(requestLabel + ' started');
    var ctl = null;
    try { ctl = new AbortController(); } catch (e) { /* older WebView: the timer still fires */ }
    var opts = { cache: 'no-store' };
    if (arguments[2]) opts.headers = arguments[2];
    if (ctl) opts.signal = ctl.signal;
    var probeControllers = typeof mobileProbeControllers !== 'undefined' ? mobileProbeControllers : null;
    if (ctl && probeControllers && arguments[2]) probeControllers[url] = ctl;
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        try { if (ctl) ctl.abort(); } catch (e) {}
        if (probeControllers && probeControllers[url] === ctl) delete probeControllers[url];
        connectionTrace(requestLabel + ' timed out');
        reject(new Error('timeout'));
      }, ms);
      var finish = function (fn, value) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (probeControllers && probeControllers[url] === ctl) delete probeControllers[url];
        connectionTrace(requestLabel + (fn === reject ? ' failed' : (value && value.ok ? ' complete' : ' unavailable')));
        fn(value);
      };
      var no = function (e) { finish(reject, e); };
      var ok = function (r) {
        if (settled) return;
        sawResponse = true;
        if (!r.ok) { finish(resolve, { ok: false, data: null }); return; }
        try {
          r.json().then(function (data) { finish(resolve, { ok: true, data: data }); }, no);
        } catch (e) { no(e); }
      };
      try { fetch(url, opts).then(ok, no); } catch (e) { no(e); }
    });
  }

  /**
   * EVERY address the host published, primary first.
   *
   * The host keeps a spare tunnel open beside the live one and publishes both
   * in the one signed record (shared/beacon.mjs). Holding the spare is what
   * turns a tunnel move from a minute of "not reachable" into one request:
   * there is nothing to wait to be told.
   *
   * The spare list is covered by its own signature and is DROPPED whole if it
   * does not verify — the beacon is signed precisely so that nobody can add an
   * address to it, and a half-trusted list would give that away.
   */
  async function verifyUrls(record) {
    var primary = await verify(record);
    if (!primary) return [];
    var alt = (record && record.alt && record.alt.length) ? record.alt : null;
    if (!alt || !record.sigAll) return [primary];
    try {
      var expected = await hmacHex(KEY, [record.url].concat(alt).join(',') + '|' + Number(record.at));
      if (expected !== String(record.sigAll)) return [primary];
    } catch (e) { return [primary]; }
    var out = [primary];
    for (var i = 0; i < alt.length; i++) {
      // No regex here on purpose. A slash inside one has to survive TWO
      // template literals on the way into the page, and it did not: the page
      // received //+$/ and would not parse at all — the whole launcher, dead,
      // from one escape. Trailing slashes come off by hand instead.
      var u = String(alt[i] || '');
      while (u.charAt(u.length - 1) === '/') u = u.slice(0, -1);
      if (u.indexOf('https://') === 0 && out.indexOf(u) < 0) out.push(u);
    }
    return out;
  }

  /**
   * THE LAST RECORD WE VERIFIED, KEPT ON THIS DEVICE.
   *
   * Both beacon stores are free services with nobody's SLA behind them, and
   * the whole chain hangs off them: if neither answers, a reader cannot even
   * NAME an address to try, and this page has to say the desk is gone while it
   * is sitting there serving. This is the backup for that — his ask,
   * 2026-09-12: "live desk ku backup rakh, kuch problem nai hona."
   *
   * IT ADDS NO TRUST, ONLY REACH. What is kept is the host's own signed
   * record, and it goes back through verifyUrls() exactly as a fresh one does
   * — same HMAC check, same BEACON_MAX_AGE_MS. So it covers a store outage of
   * up to half an hour and not one second more, and nothing a stranger could
   * write into this browser's storage is believed for an instant.
   */
  var BEACON_LS = 'auratrade-beacon-kept';
  function keepBeacon(record) {
    try { localStorage.setItem(BEACON_LS, JSON.stringify(record)); } catch (e) { /* private mode */ }
  }
  function keptBeacon() {
    try { return JSON.parse(localStorage.getItem(BEACON_LS) || 'null'); } catch (e) { return null; }
  }

  /**
   * BOTH STORES AT ONCE, AND THE FRESHEST RECORD WINS.
   *
   * One at a time meant a store that hangs cost its whole six-second deadline
   * before the other was even asked — twelve seconds of spinner to answer a
   * question either could have answered in one. It also took whichever replied
   * FIRST, so a store that had missed an update (the publisher is best-effort
   * and shrugs off a throttled write) could serve an older address while the
   * current one sat in the other store.
   */
  async function readBeacon(onCandidate) {
    var records = await Promise.all(BEACON_READS.map(function (url) {
      return fetchT(url, 10000)
        .then(async function (r) {
          var record = r.ok ? r.data : null;
          if (record && onCandidate) {
            var urls = await verifyUrls(record);
            if (urls.length) onCandidate(urls);
          }
          return record;
        })
        .catch(function () { return null; });
    }));
    var best = null;
    for (var i = 0; i < records.length; i++) {
      if (!records[i]) continue;
      var urls = await verifyUrls(records[i]);
      if (!urls.length) continue;
      if (!best || Number(records[i].at) > Number(best.rec.at)) best = { rec: records[i], urls: urls };
    }
    if (best) { keepBeacon(best.rec); return best.urls; }

    var kept = keptBeacon();
    if (kept) {
      var keptUrls = await verifyUrls(kept);
      if (keptUrls.length) return keptUrls;
    }
    return [];
  }

  /**
   * ALL AT ONCE, then the most preferred one that answered.
   *
   * One at a time was the "atak jana" he complained about: a dead address
   * costs its whole timeout before the live one is even asked, so the page sat
   * there for fifteen seconds deciding something it could have decided in one.
   * Preference order is kept rather than taking whoever is fastest, because
   * "whoever is fastest" flaps between two healthy tunnels on every poll.
   */
  function firstAlive(list) {
    return new Promise(function (done) {
      if (!list.length) return done(null);
      var results = new Array(list.length);
      var left = list.length;
      var settled = false;
      function checkEarly() {
        if (settled) return;
        for (var j = 0; j < list.length; j++) {
          if (results[j] === true) {
            settled = true;
            return done(list[j]);
          }
          if (results[j] === undefined) break;
        }
      }
      list.forEach(function (base, i) {
        alive(base).then(function (ok) {
          results[i] = ok;
          checkEarly();
          if (--left) return;
          if (!settled) {
            for (var j = 0; j < list.length; j++) if (results[j]) return done(list[j]);
            done(null);
          }
        });
      });
    });
  }

  // A candidate must actually be OUR server before anyone is sent there.
  async function alive(base) {
    if (failedFrames[base] > Date.now()) return false;
    try {
      var probeKey = KEY;
      var probeGeneration = checkGeneration;
      var needsSnapshot = MOBILE_SHELL && !currentBase;
      var r = await fetchT(base + (needsSnapshot ? '/api/signals' : '/api/ping'), needsSnapshot ? 20000 : 15000, needsSnapshot ? { 'X-AuraTrade-Key': KEY } : null);
      if (KEY !== probeKey || checkGeneration !== probeGeneration) return false;
      if (needsSnapshot) {
        if (!r.ok || !Array.isArray(r.data)) return false;
        mobileSnapshots[base] = r.data;
        saveMobileView(r.data);
        return true;
      }
      if (!r.ok) return false;
      var d = r.data;
      return !!(d && d.service === 'auratrade');
    } catch (e) { return false; }
  }

  function show(base) {
    if (base === currentBase) {
      frame.style.display = 'block';
      shade.style.display = 'none';
      return;
    }
    currentBase = base;
    // The key rides in the query string exactly as before; the desk pockets it
    // and strips it from ITS url. Nothing sensitive reaches this page's own bar.
    watchDeskReady(base);
    if (MOBILE_SHELL) {
      if (mobileShellConnected) {
        mobileShellReady = false;
        mobileShellConnected = false;
        mobileShellStarted = false;
      }
      prepareMobileShell();
      connectMobileShell();
    } else frame.src = base + '/desk?key=' + encodeURIComponent(KEY);
    frame.style.display = 'block';
    shade.style.display = 'none';
  }

  function stall(message) {
    if (MOBILE_SHELL && savedMobileViewShown) { fastPoll(true); return; }
    shade.style.display = 'grid';
    frame.style.display = 'none';
    sp.style.display = 'none';
    retry.style.display = 'inline-block';
    st.innerHTML = message;
  }

  function searching(message) {
    st.textContent = message;
    sp.style.display = 'block';
    retry.style.display = 'none';
  }

  /**
   * Resolve the live address, preferring the beacon, then the fixed name.
   *
   * NEVER RETURNS AN ADDRESS THAT DID NOT ANSWER. This used to end with
   * "return fromBeacon || null" on the reasoning that a stale beacon beats
   * telling a friend the desk is gone. It does not: the caller FRAMES whatever
   * comes back, so a dead subdomain put localhost.run's own "no tunnel here :("
   * page inside the frame — which looks exactly like the desk being broken,
   * and sits there until the next poll. He hit precisely that on 2026-09-11,
   * while the desk was up the whole time.
   *
   * The free tunnel moves every ~20 minutes by design, so a few seconds of
   * "reconnecting by itself" at each move is the honest state, and check()
   * already polls every 8 s while in it. Saying "moving" and then arriving is
   * better than showing a stranger's error page and calling it the desk.
   *
   * alive() is a real check here: /api/ping answers Access-Control-Allow-Origin
   * '*', so a file:// page (Origin: null) can make it. Verified 2026-09-11.
   */
  // On first open, probe each authenticated address as soon as it is available.
  // Store refresh still finishes and keeps the freshest verified record.
  function resolveStartup() {
    return new Promise(function (done) {
      var seen = {};
      var pending = 0;
      var discovered = false;
      var settled = false;
      function finish() {
        if (!settled && discovered && !pending) { settled = true; done(null); }
      }
      function probe(urls) {
        if (settled) return;
        if (typeof MOBILE_SHELL !== 'undefined' && MOBILE_SHELL && urls.length) searching('Connecting to live data…');
        urls.forEach(function (base) {
          if (seen[base]) return;
          seen[base] = true;
          pending++;
          alive(base).then(function (ok) {
            if (ok && !settled) {
              settled = true;
              if (typeof cancelMobileProbes === 'function') cancelMobileProbes(base);
              done(base);
            }
          }).catch(function () {}).then(function () { pending--; finish(); });
        });
      }
      // Only a fresh, signature-verified saved beacon can supply a shortcut.
      pending++;
      Promise.resolve().then(function () {
        var saved = keptBeacon();
        return saved ? verifyUrls(saved) : [];
      }).then(probe).catch(function () {}).then(function () { pending--; finish(); });
      readBeacon(probe).then(function (urls) {
        probe(urls);

      }).catch(function () {}).then(function () {
        discovered = true;
        finish();
      });
    });
  }

  async function resolve() {
    if (!currentBase) return await resolveStartup();
    if (MOBILE_SHELL) {
      var active = currentBase;
      if (await alive(active)) return active;
      // A new mobile session requires a full authenticated snapshot, not ping alone.
      failedFrames[active] = Date.now() + 15000;
      currentBase = null;
      return await resolveStartup();
    }
    var list = await readBeacon();
    // The one we are already showing goes first: two healthy addresses must
    // not make the frame jump between them on every poll.
    if (currentBase && list.indexOf(currentBase) > 0) {
      list = [currentBase].concat(list.filter(function (u) { return u !== currentBase; }));
    }
    // The fixed name is a last resort, not a step to wait through.
    // Only signature-verified addresses may receive credentials.
    return await firstAlive(list);
  }

  /**
   * The tunnel MOVES on a schedule — measured 2026-09-05: localhost.run's
   * free tunnel goes dead roughly every twenty minutes and the keeper
   * re-establishes it at a new address ~30 seconds later. So "the desk
   * went dark" is a normal event here, not an outage: hide the dead frame
   * (which would otherwise show localhost.run's own error page INSIDE it),
   * say what is happening, and poll fast until the beacon names the new
   * door. Then the frame follows.
   */
  var DESK_DOWN =
    '<b>The desk is not reachable right now.</b><br><br>' +
    'This almost always means the <b>host PC is off</b> — a power cut, or its internet dropped.<br><br>' +
    'This page keeps trying by itself. The moment that PC is back the desk opens here on its own — ' +
    'leave this page open, and do not open any older link.';

  var CANNOT_REACH =
    '<b>This page cannot reach the internet from here.</b><br><br>' +
    'Either the phone has no connection right now — or this file was opened <b>inside another app</b>, ' +
    'such as Telegram\u2019s built-in viewer, which blocks the connection it needs.<br><br>' +
    'To fix that second one, once: tap the <b>\u22ee</b> menu at the top right and choose ' +
    '<b>Open in browser</b>, or save the file and open it with <b>Chrome</b>. Open it from there after that.';

  /**
   * How recently the host must have signed something for "it is moving, not
   * gone" to be the honest answer. The keeper republishes every five minutes,
   * so ten is two missed republishes — long enough to ride out a store blip,
   * short enough that a PC which really did lose power stops being covered for.
   */
  var HOST_RECENT_MS = 10 * 60 * 1000;

  // Eight seconds was a long time to look at an error screen when the answer
  // is one request away. The probes are parallel now, so a poll costs about as
  // much as the slowest single address.
  var FAST_MS = 2500;
  var fastTimer = null;
  function fastPoll(on) {
    if (on && !fastTimer) fastTimer = setInterval(function () { check(false); }, FAST_MS);
    if (!on && fastTimer) { clearInterval(fastTimer); fastTimer = null; }
  }
  function reconnecting() {
    if (MOBILE_SHELL && savedMobileViewShown) { fastPoll(true); return; }
    shade.style.display = 'grid';
    frame.style.display = 'none';
    sp.style.display = 'block';
    retry.style.display = 'none';
    st.textContent = 'Desk is moving to a fresh address — reconnecting by itself…';
    fastPoll(true);
  }

  async function check(initial) {
    /**
     * NOTHING TO RESOLVE UNTIL THERE IS A KEY — the beacon is NAMED after it.
     * Without this guard the visibilitychange handler called check() while the
     * key box was on screen, found no beacon (BEACON_READS is still empty),
     * and stall() replaced the box with an error screen. The reader was then
     * looking at "cannot reach the internet" with no way left to type the key
     * that would have worked. Only the public build reaches it: it is the only
     * one that starts without a key.
     */
    if (!KEY) return;
    if (checking) { if (initial) checkAgain = true; return; }
    checking = true;
    var generation = checkGeneration;
    try {
      if (initial) searching('Reading the beacon…');
      var base = await resolve();
      if (generation !== checkGeneration) return;
      if (base) { fastPoll(false); show(base); return; }
      // The beacon is silent. If the desk we already show still answers,
      // this is a beacon blip and the reader keeps reading.
      if (currentBase && await alive(currentBase)) { if (generation !== checkGeneration) return; fastPoll(false); show(currentBase); return; }
      if (generation !== checkGeneration) return;
      if (!initial && currentBase && frame.style.display === 'block') { fastPoll(true); return; }
      if (currentBase) { reconnecting(); return; }
      /**
       * THE ONLY SCREENS ANYONE SEES WHEN IT IS BROKEN, so they say what to do
       * rather than what happened. His worry, 2026-09-11: "kuch issue hua to
       * mere paas Claude nahi rehta" — nobody should have to ask anyone what
       * this means. IN ENGLISH: his friends read English, and the Hinglish
       * version I wrote on 2026-09-11 is the thing he objected to the next day.
       *
       * TWO of them, because there are two different faults and one confident
       * wrong instruction is worse than none. If not a single http request has
       * completed, whether the desk is up is not the question yet.
       */
      /**
       * THE HOST IS NOT OFF IF IT WAS TALKING A MOMENT AGO.
       *
       * This branch used to be reached by every reader whose page had not yet
       * connected once — a fresh load, or a reload — and it said the host PC
       * was off. On 2026-09-12 he loaded it during a tunnel move and read that
       * about the machine he was sitting at. The beacon settles it: it is
       * signed, it carries its own timestamp, and only the host can write one.
       */
      if (Date.now() - hostSpokeAt < HOST_RECENT_MS) { reconnecting(); return; }
      stall(sawResponse ? DESK_DOWN : CANNOT_REACH);
      fastPoll(true);
    } finally {
      checking = false;
      if (checkAgain) { checkAgain = false; check(true).catch(function () {}); }
    }
  }

  retry.addEventListener('click', function () { searching('Looking again…'); check(true); });
  // A phone that was asleep wakes with a stale frame; re-resolve on return.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(false); });

  /**
   * THE STABLE HALF OF THE DESK. This page's address never changes; the
   * desk's does (every ~20 minutes), and each new address is a new origin
   * with empty localStorage and no notification permission — which is why
   * the desk kept asking "enable alerts" again and forgot the sound toggle
   * (his 2026-09-05 complaint). So the desk hands its preferences here, and
   * browser notifications are shown by THIS page under its own permission.
   * Messages are accepted only from the frame this page created.
   */
  var PREFS_LS = 'auratrade-launcher-prefs';
  function prefs() { try { return JSON.parse(localStorage.getItem(PREFS_LS) || '{}') || {}; } catch (e) { return {}; } }
  function savePrefs(p) { try { localStorage.setItem(PREFS_LS, JSON.stringify(p)); } catch (e) {} }
  function tellPrefs() {
    var p = prefs();
    try {
      frame.contentWindow.postMessage({
        auratrade: true, type: 'prefs',
        sound: typeof p.sound === 'boolean' ? p.sound : true,
        range: p.range || null,
        notifPermission: ('Notification' in window) ? Notification.permission : 'unsupported',
        // Whether this person has ALREADY been offered alerts. The desk hides
        // its chip on this alone, because a browser prompts once per origin
        // and a file:// page can never be granted at all — so a second offer
        // is a button that cannot work. Kept here, on the address that never
        // changes, so a tunnel move does not offer it all over again.
        notifAsked: p.notifAsked === true,
      }, '*');
    } catch (e) {}
  }
  function askNotif() {
    if (!('Notification' in window) || Notification.permission !== 'default') { tellPrefs(); return; }
    // The tap happened inside the frame; activation reaches this window too,
    // so the prompt usually opens straight away. If the browser refuses, the
    // desk keeps showing its chip and the next tap tries again.
    Notification.requestPermission().then(tellPrefs, tellPrefs);
  }
  window.addEventListener('message', function (ev) {
    if (!frame.contentWindow || ev.source !== frame.contentWindow) return;
    var d = ev.data;
    if (!d || d.auratrade !== true) return;
    if (MOBILE_SHELL && ev.origin !== location.origin) return;
    if (MOBILE_SHELL && d.type === 'mobile-ready') {
      connectionTrace('Mobile UI loaded');
      mobileShellReady = true;
      connectMobileShell();
      previewMobileView();
      return;
    }
    if (MOBILE_SHELL && d.type === 'mobile-key-change' && typeof d.key === 'string' && d.key.trim()) {
      checkGeneration++;
      cancelMobileProbes('');
      KEY = d.key.trim();
      deskReady();
      shade.style.display = 'grid';
      frame.style.display = 'none';
      try { localStorage.setItem(KEY_LS, KEY); } catch (e) {}
      currentBase = null;
      mobileShellStarted = false;
      mobileShellReady = false;
      mobileShellConnected = false;
      savedMobileViewShown = false;
      start(KEY).catch(function () { stall(sawResponse ? DESK_DOWN : CANNOT_REACH); });
      return;
    }
    if (MOBILE_SHELL && d.type === 'mobile-snapshot' && currentBase && d.base === currentBase) { saveMobileView(d.snapshot); return; }
    if (MOBILE_SHELL && d.type === 'route-error' && currentBase && d.base === currentBase) {
      connectionTrace('Live stream interrupted; retrying backup');
      checkGeneration++;
      failedFrames[currentBase] = Date.now() + 15000;
      currentBase = null;
      check(true);
      return;
    }
    if (d.type === 'hello') { connectionTrace('Display ready'); deskReady(); tellPrefs(); return; }
    if (d.type === 'prefs') {
      var p = prefs();
      if (typeof d.sound === 'boolean') p.sound = d.sound;
      if (d.range && d.range.mode) p.range = d.range;
      if (d.notifAsked === true) p.notifAsked = true;
      savePrefs(p);
      return;
    }
    if (d.type === 'notif-request') { askNotif(); return; }
    if (d.type === 'notify') {
      try {
        if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
        var n = new Notification(String(d.title || 'AuraTrade'), { body: String(d.body || ''), tag: 'auratrade-desk', renotify: true });
        n.onclick = function () { try { window.focus(); } catch (e) {} n.close(); };
      } catch (e) { /* no notification support here — the desk's toast and sound still fire */ }
    }
  });

  /** The beacon's name is a pure function of the key — same rule as shared/beacon.mjs beaconKeyFor. */
  async function beaconReadsFor(k) {
    var bk = 'auratrade-' + sha256HexJs('auratrade-beacon:' + k).slice(0, 24);
    return ['https://textdb.dev/api/data/' + bk, 'https://textdb.online/' + bk];
  }
  function askKeyThenStart() {
    sp.style.display = 'none';
    retry.style.display = 'none';
    st.innerHTML = 'Enter the access key (once only — this phone will remember it):' +
      '<div style="margin-top:10px"><input id="kIn" type="password" placeholder="Access key" autocomplete="off" ' +
      'style="width:100%;max-width:300px;background:#151b28;border:1px solid #232c3e;color:#dbe2ef;border-radius:10px;padding:10px 12px;font-size:14px"></div>';
    var go = document.createElement('button');
    go.textContent = 'Open the desk';
    go.style.display = 'inline-block';
    st.appendChild(go);
    var submit = function () {
      var v = (document.getElementById('kIn').value || '').trim();
      if (!v) return;
      try { localStorage.setItem(KEY_LS, v); } catch (e) {}
      go.remove();
      start(v)['catch'](function () { stall(sawResponse ? DESK_DOWN : CANNOT_REACH); });
    };
    go.onclick = submit;
    document.getElementById('kIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  }
  /**
   * NOTHING IN HERE MAY LEAVE THE PAGE ON A SPINNER, and that is the whole
   * reason for this function's shape: the status is set BEFORE the first
   * await, every await sits inside a catch, and a failure still falls through
   * to check() — which can at least try the fixed address and, failing that,
   * put up a screen that tells the reader what to do. The version this
   * replaced awaited beaconReadsFor() first with nothing around it, so when
   * that threw on a content:// page the reader was left with a spinner that
   * would still have been turning the next morning.
   */
  async function start(k) {
    KEY = k;
    var startGeneration = checkGeneration;
    if (recheckTimer) clearInterval(recheckTimer);
    prepareMobileShell();
    searching('Reading the beacon…');
    try {
      var reads = await beaconReadsFor(k);
      if (startGeneration !== checkGeneration) return;
      BEACON_READS = reads;
    } catch (e) {
      BEACON_READS = [];
    }
    try {
      await check(true);
    } catch (e) {
      stall(sawResponse ? DESK_DOWN : CANNOT_REACH);
    }
    if (startGeneration !== checkGeneration) return;
    recheckTimer = setInterval(function () { check(false); }, RECHECK_MS);
  }
  (function () {
    var k = KEY_BAKED;
    if (!k) {
      /**
       * THE KEY MAY ARRIVE IN THE FRAGMENT, AND THAT IS THE FORM TO SHARE.
       *
       * A fragment is never put into an HTTP request. Not by the browser, not
       * by a messenger fetching the page to draw a preview card, not in a
       * Referer header. So #key=... reaches this script and nothing else:
       * GitHub's access logs never see it, and neither does any intermediary
       * along the way. ?key=... sits in the request line, and every one of
       * them sees that.
       *
       * Both are accepted. The ?key= form was already handed out on
       * 2026-09-12 and has to keep working; #key= is what gets shared now.
       */
      var q = new URLSearchParams(location.search);
      var h = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
      var arrived = (h.get('key') || q.get('key') || '').trim();
      if (arrived) {
        k = arrived;
        try { localStorage.setItem(KEY_LS, k); } catch (e) {}
        // Out of the address bar either way, so a screenshot of this phone
        // does not carry it and a reload cannot re-leak it.
        q.delete('key');
        h.delete('key');
        var rest = h.toString();
        try {
          history.replaceState(null, '', location.pathname
            + (q.toString() ? '?' + q : '') + (rest ? '#' + rest : ''));
        } catch (e) {}
      }
      if (!k) { try { k = localStorage.getItem(KEY_LS) || ''; } catch (e) { k = ''; } }
    }
    /**
     * Opened inside an app's own viewer? Say so before anything is tried. The
     * address bar reads content:// there — not file://, not https:// — and no
     * amount of waiting on that page is ever going to work.
     */
    if (location.protocol !== 'file:' && location.protocol !== 'http:' && location.protocol !== 'https:') {
      var tip = document.getElementById('tip');
      if (tip) tip.innerHTML = 'Opened inside another app? Tap <b>\u22ee</b> at the top right and choose ' +
        '<b>Open in browser</b>, or save this file and open it with Chrome.';
    }
    if (k) start(k)['catch'](function () { stall(sawResponse ? DESK_DOWN : CANNOT_REACH); });
    else askKeyThenStart();
    try {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js')['catch'](function () {});
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
